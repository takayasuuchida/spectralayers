<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="つけ回し" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>つけ回し管理</title>
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <h1 id="storeName">店舗名未設定</h1>
      <span class="subtitle">つけ回し管理</span>
    </div>
    <div class="controls">
      <label class="ctrl">
        <span>基本時間</span>
        <select id="baseTime">
          <option value="50">50分</option>
          <option value="60">60分</option>
        </select>
      </label>
      <div class="ctrl">
        <span>1回転</span>
        <strong id="perRotation">16:40</strong>
      </div>
      <button class="btn" id="addGirlBtn">＋ キャスト</button>
      <button class="btn" id="addTableBtn">＋ 卓</button>
      <button class="btn ghost" id="editModeBtn">✎ 編集</button>
      <button class="btn ghost" id="settingsBtn">⚙ 設定</button>
    </div>
  </header>

  <main id="layout">
    <aside id="girlsPanel">
      <div class="panel-head">
        <h2>キャスト</h2>
        <span class="hint" id="girlHint">タップでドリンク追加</span>
      </div>
      <ul id="girlList" class="girl-list"></ul>
    </aside>

    <section id="tablesPanel">
      <div class="panel-head">
        <h2>フロア</h2>
        <span class="hint" id="tableHint">編集モードでレイアウト変更</span>
      </div>
      <div id="tables" class="tables-grid"></div>
      <div id="emptyHint" class="empty">右上「＋卓」から卓を追加してください</div>
    </section>

    <aside id="detailPanel" class="hidden">
      <div class="panel-head">
        <h2 id="detailTitle">卓詳細</h2>
        <button class="icon-btn" id="closeDetail">×</button>
      </div>
      <div class="detail-body">
        <div class="row">
          <label class="ctrl wide">
            <span>お客様名</span>
            <input type="text" id="customerName" placeholder="お客様" />
          </label>
        </div>

        <div class="time-info">
          <div><span>経過</span><strong id="elapsed">00:00</strong></div>
          <div><span>残り</span><strong id="remaining">--:--</strong></div>
          <div><span>終了予定</span><strong id="endAt">--:--</strong></div>
        </div>

        <h3>回転</h3>
        <div id="rotations" class="rotations"></div>

        <h3>ドリンク</h3>
        <div id="drinkSummary" class="drink-summary"></div>

        <h3>会計</h3>
        <div id="bill" class="bill"></div>

        <div class="row spread">
          <button class="btn danger" id="closeTableBtn">退店・会計</button>
          <button class="btn ghost" id="deleteTableBtn">卓を削除</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
