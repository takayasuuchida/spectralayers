<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔁 2店舗 振りっこボード</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  body { background:#0a0a0c; color:#e8e8ec; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; padding-bottom:120px; }
  .wrap { max-width:760px; margin:0 auto; padding:0 12px; }
  header { border-bottom:1px solid #1c1c22; padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { font-family:Georgia,serif; letter-spacing:.15em; color:#c9a64e; font-size:15px; font-weight:bold; }
  .sub { color:#6a6a72; font-size:10px; }
  .me { font-size:10px; color:#a8e6e2; border:1px solid #2a6a66; border-radius:999px; padding:3px 10px; background:rgba(63,182,176,.08); white-space:nowrap; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  @media (max-width:420px){ .grid { grid-template-columns:1fr; } }
  .store { background:#141418; border:1px solid #22222a; border-radius:16px; padding:12px; }
  .store.mine { border-color:#c9a64e; }
  .sname { font-family:Georgia,serif; font-size:17px; font-weight:bold; letter-spacing:.08em; }
  .mine .sname { color:#c9a64e; }
  .stale { color:#e08484; font-size:10px; font-weight:bold; }
  .fresh { color:#5a5a62; font-size:10px; }

  .accept { border-radius:12px; padding:10px; text-align:center; margin:8px 0; font-weight:bold; }
  .a-ok   { background:rgba(95,214,160,.12); border:1px solid #3f8f6a; color:#7ee6ac; }
  .a-soon { background:rgba(224,168,74,.12); border:1px solid #7a5a1a; color:#e8c07a; }
  .a-full { background:rgba(224,85,85,.12); border:1px solid #a15050; color:#f0a0a0; }
  .a-none { background:#0d0d10; border:1px dashed #33333c; color:#5a5a62; font-weight:normal; }
  .accept .big { font-size:20px; display:block; }
  .accept .small { font-size:10px; opacity:.85; font-weight:normal; }

  .lv-title { font-size:10px; color:#6a6a72; margin:10px 0 4px; }
  .lv { display:flex; align-items:center; gap:8px; background:#0d0d10; border:1px solid #22222a; border-radius:10px; padding:8px 10px; margin-bottom:5px; }
  .lv.soon { border-color:#7a5a1a; background:rgba(224,168,74,.07); }
  .lv.now  { border-color:#3f8f6a; background:rgba(95,214,160,.08); }
  .lv .t { font-size:17px; font-weight:bold; font-variant-numeric:tabular-nums; }
  .lv .g { font-size:13px; color:#c9a64e; font-weight:bold; }
  .lv .in { font-size:10px; color:#8a8a92; margin-left:auto; white-space:nowrap; }
  .lv .auto { font-size:9px; color:#5fd6a0; border:1px solid #2f6a4f; border-radius:4px; padding:0 4px; }
  .lv .del { background:none; border:none; color:#55555c; font-size:15px; padding:0 2px; }
  .empty { font-size:11px; color:#4a4a52; padding:6px 0; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:#0a0a0c; border-top:1px solid #1c1c22; padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; gap:8px; z-index:20; }
  .bar button { flex:1; border:none; border-radius:12px; padding:13px 4px; font-weight:bold; font-size:13px; }
  .b-gold { background:#c9a64e; color:#000; }
  .b-teal { background:#22222a; color:#3fb6b0; border:1px solid #3fb6b0 !important; }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:50; display:flex; align-items:flex-end; }
  .sheet.hidden { display:none; }
  .panel { background:#15151a; border-top:1px solid #c9a64e; border-radius:20px 20px 0 0; width:100%; max-height:88vh; overflow-y:auto; padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px); }
  .panel h3 { font-size:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .panel h3 button { background:none; border:none; color:#888; font-size:20px; }
  .lbl { font-size:10px; color:#6a6a72; margin:12px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#1c1c22; color:#9a9aa2; border:1px solid #2a2a32; border-radius:999px; padding:9px 14px; font-size:14px; font-weight:bold; }
  .chip.on { background:#c9a64e; color:#000; border-color:#c9a64e; }
  .chip.wide { flex:1; min-width:70px; text-align:center; }
  input[type=time], input[type=text] { background:#0d0d10; border:1px solid #22222a; color:#fff; border-radius:10px; padding:10px; font-size:16px; width:100%; }
  .go { width:100%; background:#c9a64e; color:#000; border:none; border-radius:12px; padding:15px; font-weight:bold; font-size:15px; margin-top:16px; }
  .go:disabled { background:#2a2a32; color:#5a5a62; }

  .alert { background:rgba(201,166,78,.14); border:1px solid #c9a64e; border-radius:14px; padding:12px; margin-top:12px; }
  .alert .h { color:#c9a64e; font-weight:bold; font-size:14px; }
  .alert .b { font-size:12px; color:#d8d8dd; margin-top:3px; }
  .alert button { margin-top:8px; background:#c9a64e; color:#000; border:none; border-radius:8px; padding:7px 16px; font-weight:bold; font-size:12px; }
  .note { font-size:10px; color:#4a4a52; text-align:center; margin-top:16px; line-height:1.7; }
  .err { background:rgba(224,85,85,.1); border:1px solid #a15050; color:#f0b0b0; border-radius:10px; padding:8px 10px; font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">🔁 振りっこボード</div>
    <div class="sub" id="clock">–</div>
  </div>
  <button class="me" id="meBtn">店舗を選ぶ</button>
</header>

<div class="wrap">
  <div id="alerts"></div>
  <div class="grid" id="grid"></div>
  <div id="err"></div>
  <p class="note">
    10秒ごとに自動更新。<br>
    このURLをホーム画面に追加しておくと1タップで開けます。
  </p>
</div>

<div class="bar">
  <button class="b-gold" id="addBtn">＋ 退店予定</button>
  <button class="b-teal" id="acceptBtn">受入状況</button>
  <button class="b-teal" id="sendBtn">📨 送客</button>
</div>

<!-- 店舗選択 -->
<div class="sheet hidden" id="sheetMe">
  <div class="panel">
    <h3>この端末はどちらのお店？<button data-close>×</button></h3>
    <div class="chips" id="meChips"></div>
    <p class="lbl">選んだお店として書き込みます。両方のお店の状況はどちらを選んでも見られます。</p>
  </div>
</div>

<!-- 退店予定 -->
<div class="sheet hidden" id="sheetAdd">
  <div class="panel">
    <h3>退店予定を知らせる<button data-close>×</button></h3>
    <div class="lbl">何分後に出る？</div>
    <div class="chips" id="minChips"></div>
    <div class="lbl">または時刻を直接</div>
    <input type="time" id="timeInput">
    <div class="lbl">何名様？</div>
    <div class="chips" id="guestChips"></div>
    <div class="lbl">ひとこと（任意）</div>
    <input type="text" id="memoInput" placeholder="例: 男性3名・年配・お酒強め">
    <button class="go" id="addGo">この内容で知らせる</button>
  </div>
</div>

<!-- 受入状況 -->
<div class="sheet hidden" id="sheetAccept">
  <div class="panel">
    <h3>今の受入状況<button data-close>×</button></h3>
    <div class="lbl">お客様を受けられる？</div>
    <div class="chips" id="lvChips"></div>
    <div class="lbl">何名まで入れる？</div>
    <div class="chips" id="seatChips"></div>
    <button class="go" id="acceptGo">この状況で知らせる</button>
  </div>
</div>

<!-- 送客 -->
<div class="sheet hidden" id="sheetSend">
  <div class="panel">
    <h3>相手のお店へ送客を伝える<button data-close>×</button></h3>
    <div class="lbl">何名送る？</div>
    <div class="chips" id="sendGuestChips"></div>
    <div class="lbl">ひとこと（任意）</div>
    <input type="text" id="sendMemo" placeholder="例: 今から向かいます・○○様のご紹介">
    <button class="go" id="sendGo">送客を知らせる</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  // ---- 接続先（つけ回しツールと同じ場所を使う） ----
  var BASE = (function () {
    try { return localStorage.getItem("share-endpoint-override") || "https://kngkckweonnnhfocfqan.supabase.co"; }
    catch (e) { return "https://kngkckweonnnhfocfqan.supabase.co"; }
  })();
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuZ2tja3dlb25ubmhmb2NmcWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTQwODUsImV4cCI6MjA5NzU3MDA4NX0.lUeIniKLSh3wxjTL0JGB0PAamSv3X8JEidZtvKhO8-E";
  var H = { apikey: KEY, Authorization: "Bearer " + KEY };

  var STORES = [
    { id: "vivace", name: "vivace", shareKeys: ["share:viverce", "share:vivace"] },
    { id: "anela",  name: "ANELA",  shareKeys: ["share:ANELA", "share:anela"] }
  ];
  var LS_ME = "board-me";
  var LS_SEEN = "board-seen-at";

  var me = null;              // 自店の id
  var data = {};              // { storeId: boardDoc }
  var autoLeaving = {};       // { storeId: [entry] }  つけ回しツールから自動生成
  var lastErr = "";
  var draft = { min: 30, guests: 2, level: "ok", seats: 4, sendGuests: 2 };

  // ---------- 小道具 ----------
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function other(id) { return id === "vivace" ? "anela" : "vivace"; }
  function storeOf(id) { for (var i = 0; i < STORES.length; i++) if (STORES[i].id === id) return STORES[i]; return STORES[0]; }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function emptyDoc(id) { return { at: 0, name: storeOf(id).name, accept: null, leaving: [], sending: [] }; }

  // ---------- 通信 ----------
  function getRow(key) {
    return fetch(BASE + "/rest/v1/floor?key=eq." + encodeURIComponent(key) + "&select=data,updated_at", { headers: H })
      .then(function (r) { return r.json(); })
      .then(function (rows) { return (Array.isArray(rows) && rows[0]) ? rows[0].data : null; })
      .catch(function () { return null; });
  }
  function putRow(key, obj) {
    return fetch(BASE + "/rest/v1/floor?on_conflict=key", {
      method: "POST",
      headers: Object.assign({}, H, { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }),
      body: JSON.stringify([{ key: key, data: obj, updated_at: new Date().toISOString() }])
    }).then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  // 自店の書き込みは「読んでから足す」ことで、2人が同時に触っても消し合わないようにする
  function updateMine(fn) {
    if (!me) return Promise.resolve(false);
    var key = "board:" + me;
    return getRow(key).then(function (cur) {
      var doc = cur && typeof cur === "object" ? cur : emptyDoc(me);
      doc.name = storeOf(me).name;
      doc.leaving = doc.leaving || [];
      doc.sending = doc.sending || [];
      fn(doc);
      doc.at = Date.now();
      doc.leaving = prune(doc.leaving);
      doc.sending = (doc.sending || []).filter(function (s) { return Date.now() - s.at < 2 * 3600e3; }).slice(-20);
      data[me] = doc;
      render();
      return putRow(key, doc);
    });
  }
  // 予定時刻から30分過ぎたものは自動で消す
  function prune(list) {
    var now = Date.now();
    return (list || []).filter(function (e) { return now - e.t < 30 * 60e3; })
      .sort(function (a, b) { return a.t - b.t; }).slice(0, 40);
  }

  // つけ回しツールの共有データ → 退店予定に変換
  function fromShare(share) {
    if (!share || !share.tables) return null;
    var now = Date.now();
    var out = [], free = 0, freeSeats = 0;
    share.tables.forEach(function (t) {
      if (!t.busy) { free++; freeSeats += (t.cap || 0); return; }
      if (t.preparing || t.remainMin == null) return;
      out.push({ id: "auto-" + (t.label || ""), t: now + t.remainMin * 60e3, guests: t.guests || 0, auto: true, memo: t.label || "" });
    });
    return { leaving: out.sort(function (a, b) { return a.t - b.t; }), free: free, freeSeats: freeSeats, at: share.at || 0 };
  }

  function poll() {
    var jobs = [];
    STORES.forEach(function (s) {
      jobs.push(getRow("board:" + s.id).then(function (d) { if (d) data[s.id] = d; else if (!data[s.id]) data[s.id] = emptyDoc(s.id); }));
      // つけ回しツールを使っている店は自動で取り込む
      jobs.push(
        getRow(s.shareKeys[0]).then(function (d) { return d || getRow(s.shareKeys[1]); })
          .then(function (d) { autoLeaving[s.id] = fromShare(d); })
      );
    });
    return Promise.all(jobs).then(function () { lastErr = ""; render(); })
      .catch(function (e) { lastErr = String(e && e.message || e); render(); });
  }

  // ---------- 描画 ----------
  function render() {
    $("clock").textContent = hhmm(Date.now()) + " 現在";
    $("meBtn").textContent = me ? ("この端末: " + storeOf(me).name) : "▶ 店舗を選ぶ";
    var g = $("grid"); g.innerHTML = "";
    var order = me ? [me, other(me)] : ["vivace", "anela"];
    order.forEach(function (id) { g.appendChild(panelFor(id)); });
    renderAlerts();
    $("err").innerHTML = lastErr ? '<div class="err">通信エラー: ' + esc(lastErr) + '<br>電波を確認してください。表示は最後に取れた内容です。</div>' : "";
  }

  function panelFor(id) {
    var st = storeOf(id), doc = data[id] || emptyDoc(id), auto = autoLeaving[id];
    var el = document.createElement("div");
    el.className = "store" + (id === me ? " mine" : "");
    var updAt = Math.max(doc.at || 0, auto ? auto.at || 0 : 0);
    var mins = updAt ? Math.floor((Date.now() - updAt) / 60000) : null;
    var freshHtml = updAt
      ? (mins >= 20 ? '<span class="stale">⚠ ' + mins + '分 更新なし</span>' : '<span class="fresh">' + (mins <= 0 ? "たった今" : mins + "分前") + '</span>')
      : '<span class="fresh">未共有</span>';

    // 受入状況（手動が優先、無ければツールの空き卓から）
    var acc = doc.accept, accHtml;
    if (acc && Date.now() - acc.at < 3 * 3600e3) {
      var cls = acc.level === "ok" ? "a-ok" : acc.level === "soon" ? "a-soon" : "a-full";
      var txt = acc.level === "ok" ? "◯ 今すぐOK" : acc.level === "soon" ? "△ もう少しで空く" : "✕ 満席";
      accHtml = '<div class="accept ' + cls + '"><span class="big">' + txt + '</span>'
        + (acc.level !== "full" ? '<span class="small">' + acc.seats + '名まで</span>' : '') + '</div>';
    } else if (auto) {
      var c2 = auto.free > 0 ? "a-ok" : "a-full";
      accHtml = '<div class="accept ' + c2 + '"><span class="big">' + (auto.free > 0 ? "◯ 空き " + auto.free + "卓" : "✕ 満席") + '</span>'
        + '<span class="small">つけ回しツールから自動</span></div>';
    } else {
      accHtml = '<div class="accept a-none">受入状況 未入力</div>';
    }

    var list = prune((doc.leaving || []).concat(auto ? auto.leaving : []));
    var lvHtml = "";
    if (!list.length) lvHtml = '<div class="empty">退店予定はまだありません</div>';
    list.forEach(function (e) {
      var diff = Math.round((e.t - Date.now()) / 60000);
      var cls = diff <= 0 ? "now" : diff <= 15 ? "soon" : "";
      var inTxt = diff <= 0 ? "出てるはず" : "あと" + diff + "分";
      lvHtml += '<div class="lv ' + cls + '">'
        + '<span class="t">' + hhmm(e.t) + '</span>'
        + '<span class="g">' + (e.guests || 0) + '名</span>'
        + (e.auto ? '<span class="auto">自動</span>' : '')
        + (e.memo && !e.auto ? '<span class="in" style="margin-left:4px;color:#6a6a72">' + esc(e.memo) + '</span>' : '')
        + '<span class="in">' + inTxt + '</span>'
        + (!e.auto && id === me ? '<button class="del" data-del="' + e.id + '">×</button>' : '')
        + '</div>';
    });

    el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline">'
      + '<span class="sname">' + esc(st.name) + '</span>' + freshHtml + '</div>'
      + accHtml
      + '<div class="lv-title">これから出るお客様</div>' + lvHtml;
    return el;
  }

  function renderAlerts() {
    var box = $("alerts"); box.innerHTML = "";
    if (!me) return;
    var seen = 0; try { seen = +localStorage.getItem(LS_SEEN) || 0; } catch (e) {}
    var from = data[other(me)];
    if (!from || !from.sending) return;
    from.sending.forEach(function (s) {
      if (s.to !== me || s.at <= seen) return;
      var d = document.createElement("div");
      d.className = "alert";
      d.innerHTML = '<div class="h">📨 ' + esc(storeOf(other(me)).name) + ' から ' + s.guests + '名 送客</div>'
        + '<div class="b">' + hhmm(s.at) + ' 連絡' + (s.memo ? ' ・ ' + esc(s.memo) : '') + '</div>'
        + '<button data-ack="' + s.at + '">確認しました</button>';
      box.appendChild(d);
    });
  }

  // ---------- 操作 ----------
  function openSheet(id) { $(id).classList.remove("hidden"); }
  function closeSheets() { ["sheetMe", "sheetAdd", "sheetAccept", "sheetSend"].forEach(function (i) { $(i).classList.add("hidden"); }); }

  function chipRow(host, items, cur, onPick, wide) {
    host.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "chip" + (it.v === cur ? " on" : "") + (wide ? " wide" : "");
      b.textContent = it.l;
      b.onclick = function () { onPick(it.v); };
      host.appendChild(b);
    });
  }

  function drawAdd() {
    chipRow($("minChips"), [
      { l: "今すぐ", v: 0 }, { l: "15分後", v: 15 }, { l: "30分後", v: 30 },
      { l: "45分後", v: 45 }, { l: "60分後", v: 60 }, { l: "90分後", v: 90 }
    ], draft.min, function (v) { draft.min = v; $("timeInput").value = ""; drawAdd(); });
    chipRow($("guestChips"), [1, 2, 3, 4, 5, 6, 7, 8, 10].map(function (n) { return { l: n + "名", v: n }; }),
      draft.guests, function (v) { draft.guests = v; drawAdd(); });
  }
  function drawAccept() {
    chipRow($("lvChips"), [
      { l: "◯ 今すぐOK", v: "ok" }, { l: "△ もう少し", v: "soon" }, { l: "✕ 満席", v: "full" }
    ], draft.level, function (v) { draft.level = v; drawAccept(); }, true);
    chipRow($("seatChips"), [1, 2, 3, 4, 5, 6, 8, 10, 12].map(function (n) { return { l: n + "名", v: n }; }),
      draft.seats, function (v) { draft.seats = v; drawAccept(); });
  }
  function drawSend() {
    chipRow($("sendGuestChips"), [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return { l: n + "名", v: n }; }),
      draft.sendGuests, function (v) { draft.sendGuests = v; drawSend(); });
  }
  function drawMe() {
    chipRow($("meChips"), STORES.map(function (s) { return { l: s.name, v: s.id }; }), me, function (v) {
      me = v; try { localStorage.setItem(LS_ME, v); } catch (e) {}
      closeSheets(); render(); poll();
    }, true);
  }

  function needMe() {
    if (me) return true;
    openSheet("sheetMe"); drawMe(); return false;
  }

  // ---------- 起動 ----------
  try { me = localStorage.getItem(LS_ME); } catch (e) {}
  if (!STORES.some(function (s) { return s.id === me; })) me = null;

  $("meBtn").onclick = function () { drawMe(); openSheet("sheetMe"); };
  $("addBtn").onclick = function () { if (!needMe()) return; drawAdd(); openSheet("sheetAdd"); };
  $("acceptBtn").onclick = function () { if (!needMe()) return; drawAccept(); openSheet("sheetAccept"); };
  $("sendBtn").onclick = function () { if (!needMe()) return; drawSend(); openSheet("sheetSend"); };

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute("data-close")) { closeSheets(); return; }
    if (t.classList && t.classList.contains("sheet")) { closeSheets(); return; }
    var del = t.getAttribute && t.getAttribute("data-del");
    if (del) {
      updateMine(function (doc) { doc.leaving = (doc.leaving || []).filter(function (e) { return e.id !== del; }); });
      return;
    }
    var ack = t.getAttribute && t.getAttribute("data-ack");
    if (ack) {
      var from = data[other(me)];
      var newest = +ack;
      if (from && from.sending) from.sending.forEach(function (s2) { if (s2.to === me && s2.at > newest) newest = s2.at; });
      try { localStorage.setItem(LS_SEEN, String(newest)); } catch (e) {}
      renderAlerts(); return;
    }
  });

  $("addGo").onclick = function () {
    var when;
    var tv = $("timeInput").value;
    if (tv) {
      var p = tv.split(":"), d = new Date();
      d.setHours(+p[0], +p[1], 0, 0);
      // 深夜営業: 入力時刻が現在より6時間以上前なら翌日扱い
      if (d.getTime() < Date.now() - 6 * 3600e3) d.setDate(d.getDate() + 1);
      when = d.getTime();
    } else {
      when = Date.now() + draft.min * 60e3;
    }
    var memo = $("memoInput").value.trim();
    var g = draft.guests;
    $("addGo").disabled = true;
    updateMine(function (doc) {
      doc.leaving.push({ id: uid(), t: when, guests: g, memo: memo, at: Date.now() });
    }).then(function () {
      $("addGo").disabled = false; $("memoInput").value = ""; $("timeInput").value = ""; closeSheets();
    });
  };

  $("acceptGo").onclick = function () {
    $("acceptGo").disabled = true;
    updateMine(function (doc) { doc.accept = { level: draft.level, seats: draft.seats, at: Date.now() }; })
      .then(function () { $("acceptGo").disabled = false; closeSheets(); });
  };

  $("sendGo").onclick = function () {
    var memo = $("sendMemo").value.trim(), g = draft.sendGuests;
    $("sendGo").disabled = true;
    updateMine(function (doc) {
      doc.sending.push({ id: uid(), to: other(me), guests: g, memo: memo, at: Date.now() });
    }).then(function () { $("sendGo").disabled = false; $("sendMemo").value = ""; closeSheets(); });
  };

  render();
  // 初めて開いたときは、どちらのお店かを最初に選んでもらう
  if (!me) { drawMe(); openSheet("sheetMe"); }
  poll();
  setInterval(poll, 10000);
  setInterval(render, 30000); // 「あと○分」を進める
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
